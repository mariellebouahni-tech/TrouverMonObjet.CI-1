<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<title>Détails du produit</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#F5F1E8;
}

header{
    background:#F77F00;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

img{
    width:100%;
    border-radius:10px;
    margin-bottom:20px;
}

h2{
    color:#F77F00;
}

p{
    font-size:16px;
    margin:10px 0;
}

button{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#F77F00;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#d96d00;
}

.headerDetails{
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
position:sticky;
top:0;
z-index:1000;
}

.headerDetails h1{
font-size:22px;
color:#F77F00;
margin:0;
}

.btnRetour,
.btnPartager{
width:45px;
height:45px;
border:none;
border-radius:50%;
background:#F77F00;
color:white;
font-size:22px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

.galerie{
margin-bottom:20px;
}

#image{
width:100%;
height:320px;
object-fit:cover;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

#miniatures{
display:flex;
gap:10px;
margin-top:12px;
overflow-x:auto;
}

#miniatures img{
width:70px;
height:70px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
border:2px solid transparent;
}

#miniatures img:hover{
border-color:#F77F00;
}

</style>

</head>
<body>

<header class="headerDetails">

<button class="btnRetour" onclick="history.back()">
⬅
</button>

<h1>🛒 Détails du produit</h1>

<button class="btnPartager" onclick="partagerProduit()">
<span class="material-symbols-outlined">share</span>
</button>

</header>

<div class="container" id="detailsProduit">

<div class="galerie">

<img id="image" src="" alt="Produit">

<div id="miniatures"></div>

</div>

<h2 id="nom"></h2>

<p><strong>Catégorie :</strong> <span id="categorie"></span></p>

<p><strong>Prix :</strong> <span id="prix"></span> FCFA</p>

<p><strong>Boutique :</strong> <span id="boutique"></span></p>

<p><strong>Ville :</strong> <span id="ville"></span></p>

<p><strong>Adresse :</strong> <span id="adresse"></span></p>

<p><strong>Téléphone :</strong> <span id="telephone"></span></p>

<p><strong>Description :</strong></p>

<p id="description"></p>

<button onclick="history.back()">⬅ Retour</button>

<button onclick="laisserAvis()">
⭐ Laisser un avis
</button>

<h3>⭐ Avis des acheteurs</h3>

<div id="listeAvis">
Aucun avis pour le moment.
</div>

</div>

<script src="script.js"></script>

<script>
chargerDetailsProduit();
</script>

</body>
</html>
