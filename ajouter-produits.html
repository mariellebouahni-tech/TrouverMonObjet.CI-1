<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajouter un produit</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#F5F1E8;
}

header{
    background:#F77F00;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:6px;
    background:#F77F00;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d96d00;
}
</style>

</head>
<body>

<header>
<h1 id="titrePage">➕ Ajouter un produit</h1>
</header>

<div class="container">

<label for="nom">Nom du produit</label>
<input type="text" id="nom" required>

<select id="catégorie">
    <option value="">-- Choisir une catégorie --</option>
    <option>Électronique</option>
    <option>Téléphones</option>
    <option>Informatique</option>
    <option>Électroménager</option>
    <option>Mode</option>
    <option>Chaussures</option>
    <option>Beauté</option>
    <option>Maison</option>
    <option>Meubles</option>
    <option>Alimentation</option>
    <option>Sport</option>
    <option>Automobile</option>
    <option>Bricolage</option>
    <option>Livres</option>
    <option>Jouets</option>
    <option>Autres</option>
</select>

<label for="prix">Prix</label>
<input type="number" id="prix" required>

<label for="stock">Stock disponible (facultatif)</label>
<input type="number" id="stock" min="0" placeholder="Laisser vide si vous ne souhaitez pas l'indiquer">

<div style="display:flex;align-items:center;gap:10px;margin:15px 0;">

    <input
        type="checkbox"
        id="promotion"
        onchange="afficherPromotion()"
        style="width:auto;margin:0;">

    <label for="promotion" style="margin:0;font-weight:bold;">
        Produit en promotion
    </label>

</div>

<div id="zonePromotion" style="display:none;">

 <label>Prix promotionnel</label>
<input type="number" id="prixPromotionnel">

    <label>Fin de promotion</label>
<input type="date" id="finPromotion">

</div>

<label for="boutique">Boutique</label>
<input type="text" id="boutique">

<label for="adresse">Adresse</label>
<input type="text" id="adresse">

<label for="telephone">Téléphone</label>
<input type="tel" id="telephone">

<label for="ville">Ville</label>
<input type="text" id="ville">

<label for="description">Description</label>
<textarea id="description" rows="4"></textarea>

<label for="images">📷  images</label>
<input type="file" id="images" multiple accept="image/*">

<p id="nomFichier"></p>

<script>
document.getElementById("images").addEventListener("change", function () {
    console.log(this.files);
    document.getElementById("nomFichier").textContent =
        this.files.length + " fichier(s) sélectionné(s)";
});
</script>

<button id="btnProduit" type="button" onclick="publierProduit()">
Publier le produit
</button>

<script>
function testBouton(){
    alert("Le bouton fonctionne");
}
</script>

</div>

<script src="script.js"></script>

</body>
</html>
