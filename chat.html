<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#F5F1E8;
    margin:0;
}

header{
    background:#F77F00;
    color:white;
    text-align:center;
    padding:15px;
}

#messages{
    height:65vh;
    overflow-y:auto;
    padding:15px;
}

.message{
    background:white;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}

.bas{
    display:flex;
    padding:10px;
    gap:10px;
}

.bas input{
    flex:1;
    padding:10px;
}

.bas button{
    background:#F77F00;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#F5F1E8;
}

.header-chat{
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#F77F00;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    z-index:1000;
}

#messages{
    padding:80px 15px 90px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.messageMoi{
    align-self:flex-end;
    background:#F77F00;
    color:white;
    padding:12px 15px;
    border-radius:18px 18px 4px 18px;
    max-width:75%;
}

.messageAutre{
    align-self:flex-start;
    background:white;
    padding:12px 15px;
    border-radius:18px 18px 18px 4px;
    max-width:75%;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.zoneSaisie{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    gap:10px;
    background:white;
    padding:10px;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.zoneSaisie input{
    flex:1;
    padding:12px;
    border-radius:30px;
    border:1px solid #ccc;
}

.zoneSaisie button{
    width:55px;
    border:none;
    border-radius:50%;
    background:#F77F00;
    color:white;
    font-size:22px;
}
</style>
</head>

<body>

<div class="header-chat">
💬Messagerie
</div>

<div id="messages"></div>

<div class="zoneSaisie">
    <input
        id="message"
        type="text"
        placeholder="Écrire un message...">

    <button onclick="envoyerMessage()">
        ➤
    </button>
</div>

<script src="script.js"></script>

</body>
</html>
