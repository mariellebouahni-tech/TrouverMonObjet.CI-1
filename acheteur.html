<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 Trouver Mon Objet CI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F5F1E8;
color:#333;
padding-bottom:90px;
}

/* HEADER */

header{
background:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:28px;
font-weight:bold;
color:#F77F00;
}

.logo span{
color:#333;
}

header i{
font-size:26px;
cursor:pointer;
color:#333;
}

/* RECHERCHE */

.recherche{
margin:20px;
display:flex;
gap:10px;
}

.recherche input{
flex:1;
padding:16px;
border:none;
border-radius:15px;
font-size:17px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.recherche button{
width:60px;
border:none;
border-radius:15px;
background:#F77F00;
color:white;
font-size:22px;
cursor:pointer;
}

/* CATEGORIES */

.categories{
display:flex;
overflow-x:auto;
gap:12px;
padding:0 20px 20px;
}

.categories::-webkit-scrollbar{
display:none;
}

.categorie{
background:white;
padding:12px 18px;
border-radius:15px;
white-space:nowrap;
box-shadow:0 2px 8px rgba(0,0,0,.1);
font-weight:bold;
}

.titre{
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
margin:20px 0;
}

.titre h2{
font-size:30px;
}

.titre a{
text-decoration:none;
color:#F77F00;
font-weight:bold;
}

/* CARTES PRODUITS */

#produitsAccueil,
#resultats{
    padding:0 20px;
}

.carte{
    display:flex;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
    transition:.3s;
}

.carte:hover{
    transform:translateY(-3px);
}

.carte img{
    width:200px;
    height:200px;
    object-fit:contain;
    background:#fff;
    border-radius:20px;
}

.infos{
    width:55%;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.infos h3{
    font-size:20px;
    margin-bottom:8px;
    color:#333;
}

.prix{
    color:#F77F00;
    font-size:26px;
    font-weight:bold;
    margin:10px 0;
}

.ville{
    color:#777;
    font-size:15px;
}

.boutique{
    color:#555;
    margin-top:6px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:auto;
}

.btn{
    flex:1;
    border:none;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.btnOrange{
    background:#F77F00;
    color:white;
}

.btnBlanc{
    background:#f2f2f2;
}

.promo{
    display:inline-block;
    background:red;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:8px;
}
.menuBas{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px 0;
box-shadow:0 -3px 10px rgba(0,0,0,.15);
z-index:999;
}

.menuBas a{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:#666;
font-size:13px;
}

.menuBas a i{
font-size:22px;
margin-bottom:5px;
}

.menuBas .actif{
color:#F77F00;
font-weight:bold;
}

.rechercheVille{
    margin:0 20px 20px;
}

.rechercheVille input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    font-size:17px;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.menuLateral{
width:0;
position:fixed;
top:0;
left:0;
height:100%;
background:white;
overflow-x:hidden;
transition:0.3s;
z-index:2000;
}

.categories{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    gap:12px;
    padding:0 20px 20px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.categorie{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px 18px;
    background:white;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    white-space:nowrap;
    cursor:pointer;
}

.categorie.active{
background:#F77F00;
color:white;
}

#titreResultats,
#resultats{
    display:none;
}

.menuLateral{
    width:0;
    position:fixed;
    top:0;
    left:0;
    height:100%;
    background:white;
    overflow-x:hidden;
    transition:0.3s;
    z-index:2000;
    padding-top:60px;
}

.menuLateral a{
    display:block;
    padding:15px 25px;
    text-decoration:none;
    color:#333;
    font-size:18px;
}

.menuLateral a:hover{
    background:#F77F00;
    color:white;
}

.fermer{
    position:absolute;
    top:15px;
    right:20px;
    font-size:35px;
}
</style>

</head>
<body>
  
  <div id="menuLateral" class="menuLateral">

<a href="javascript:void(0)" class="fermer"
onclick="fermerMenu()">&times;</a>

<a href="acheteur.html">
🏠 Accueil
</a>

<a href="mes-favoris.html">
❤️ Favoris
</a>

<a href="messagerie.html">
💬 Messages
</a>

<a href="notifications.html">
    🔔  Notifications
</a>

<a href="profil-acheteur.html">
👤 Mon profil
</a>

<hr>

<a href="#" onclick="deconnexionAcheteur()">
🚪 Déconnexion
</a>

</div>
<header>

    <i class="fa-solid fa-bars" onclick="ouvrirMenu()"></i>

    <div class="logo">
        🛒 <span>Trouver Mon Objet CI</span>
    </div>

    <div style="position:relative">

        <i class="fa-solid fa-bell"
       onclick="window.location.href='messagerie.html'"></i>

        <span id="nbNotifications"
              style="
              position:absolute;
              top:-8px;
              right:-8px;
              background:red;
              color:white;
              border-radius:50%;
              min-width:20px;
              height:20px;
              display:flex;
              justify-content:center;
              align-items:center;
              font-size:12px;
              font-weight:bold;">
            0
        </span>

    </div>

</header>

<div class="recherche">

    <input
    type="text"
    id="recherche"
    placeholder="🔍Rechercher un produit..."
    oninput="chercher()">

</div>

<div class="rechercheVille">

    <input
    type="text"
    id="rechercheVille"
    placeholder="🔍 Rechercher une ville..."
    oninput="chercher()">

</div>

<div class="categories">

<div class="categorie" onclick="filtrerCategorie('Téléphones',event)">
📱 Téléphones
</div>

<div class="categorie" onclick="filtrerCategorie('Informatique',event)">
💻 Informatique
</div>

<div class="categorie" onclick="filtrerCategorie('Mode',event)">
👕 Mode
</div>

<div class="categorie" onclick="filtrerCategorie('Maison',event)">
🏠 Maison
</div>

<div class="categorie" onclick="filtrerCategorie('Alimentation',event)">
🍔 Alimentation
</div>

<div class="categorie" onclick="filtrerCategorie('Automobile',event)">
🚗 Automobile
</div>

<div class="categorie" onclick="filtrerCategorie('Beauté',event)">
💄 Beauté
</div>

<div class="categorie" onclick="filtrerCategorie('Sport',event)">
⚽ Sport
</div>

<div class="categorie categoriePlus" onclick="afficherToutesCategories()">
➕ Voir plus
</div>

</div>

<div class="titre" id="titrePopulaires">

    <h2>🔥 Produits populaires</h2>

    <a href="#">Voir tout</a>

</div>

<div id="produitsAccueil"></div>

<div class="titre" id="titreResultats">
    <h2>🔍 Résultats</h2>
</div>

<div id="resultats"></div>

<nav class="menuBas">

<a href="acheteur.html" class="actif">
<i class="fa-solid fa-house"></i>
<span>Accueil</span>
</a>

<a href="mes-favoris.html">
<i class="fa-solid fa-heart"></i>
<span>Favoris</span>
</a>

<a href="messagerie.html">
<i class="fa-solid fa-comments"></i>
<span>Messages</span>
</a>

<a href="profil-acheteur.html">
<i class="fa-solid fa-user"></i>
<span>Profil</span>
</a>

</nav>

<script src="script.js"></script>

</body>
</html>
