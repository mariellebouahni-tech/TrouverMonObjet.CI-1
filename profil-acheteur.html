<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#F5F1E8;
    margin:0;
}

header{
    background:#F77F00;
    color:white;
    text-align:center;
    padding:20px;
}

.carte{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.carte h3{
    margin-top:0;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#F77F00;
    color:white;
    font-size:16px;
}

button.rouge{
    background:#d9534f;
}

</style>

</head>

<body>

<header>
<h2>👤 Mon profil</h2>
</header>

<div class="carte">

<h3 id="nomAcheteur">Acheteur</h3>

<p><strong>Email :</strong></p>
<p id="emailAcheteur"></p>

<button onclick="window.location.href='modifier-profil-acheteur.html'">
✏ Modifier mon profil
</button>

<button onclick="window.location.href='messagerie.html'">
💬 Mes messages
</button>

<button class="rouge" onclick="deconnexionAcheteur()">
🚪 Se déconnecter
</button>

</div>

<script src="script.js"></script>

<script>

document.getElementById("emailAcheteur").textContent =
localStorage.getItem("acheteurEmail") || "";

</script>

</body>
</html>
