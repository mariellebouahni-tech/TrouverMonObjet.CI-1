<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscription Acheteur</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#F5F1E8;
}

header{
    background:#F77F00;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:600px;
    margin:20px auto;
    padding:20px;
}

form{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#F77F00;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d96c00;
}

a{
    color:#F77F00;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>Créer un compte acheteur</h1>
</header>

<div class="container">

<form onsubmit="inscrireAcheteur(event)">

<input type="text" id="nom" placeholder="Nom complet" required>

<input type="tel" id="telephone" placeholder="Téléphone" required>

<input type="email" id="email" placeholder="Email" required>

<input type="ville" id="ville" placeholder="ville" required>

<input type="password" id="motdepasse" placeholder="Mot de passe" required>

<input type="password" id="confirmation" placeholder="Confirmer le mot de passe" required>

<button type="submit">S'inscrire</button>

<p style="text-align:center;">
Déjà inscrit ?
<a href="connexion-acheteur.html">Se connecter</a>
</p>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
